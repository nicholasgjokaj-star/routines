[project]
name = "routines"
version = "0.1.0"
description = "Every scheduled job and background refresher in this workspace, with its schedule, health, and run history"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
    "imbue-common",
    "loguru>=0.7",
    "pydantic>=2.0",
]

[project.scripts]
routines = "routines.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routines"]
