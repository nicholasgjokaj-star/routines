<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routines</title>
<style>
  :root {
    --ink: #16181d;
    --ink-soft: #5d6470;
    --ink-faint: #8b929e;
    --line: #e4e7ec;
    --bg: #fbfbfc;
    --panel: #ffffff;
    --ok: #12805c;
    --ok-bg: #e7f5ef;
    --bad: #b42318;
    --bad-bg: #fdeceb;
    --warn: #96620a;
    --warn-bg: #fdf3e3;
    --idle: #5d6470;
    --idle-bg: #f1f2f4;
    --busy: #3538cd;
    --busy-bg: #eef0ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 28px 72px; }

  header.page { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
  header.page h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  header.page p { margin: 0; color: var(--ink-soft); }

  .summary { display: flex; gap: 28px; padding: 16px 0 20px; border-bottom: 1px solid var(--line); }
  .summary div { display: flex; flex-direction: column; gap: 2px; }
  .summary .n { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .summary .n.bad { color: var(--bad); }
  .summary .k { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; }

  h2.section { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; margin: 34px 0 10px; }
  h2.section .blurb { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-faint); margin-left: 10px; }

  .row {
    display: grid;
    grid-template-columns: 1fr 180px 200px 132px;
    gap: 16px;
    align-items: start;
    padding: 16px 4px;
    border-bottom: 1px solid var(--line);
  }
  .name { font-weight: 600; }
  .name .what { display: block; font-weight: 400; color: var(--ink-soft); margin-top: 2px; }
  .name .what.raw { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px;
    white-space: nowrap;
  }
  .pill.working { color: var(--ok); background: var(--ok-bg); }
  .pill.failing, .pill.stopped { color: var(--bad); background: var(--bad-bg); }
  .pill.overdue { color: var(--warn); background: var(--warn-bg); }
  .pill.paused, .pill.never_run { color: var(--idle); background: var(--idle-bg); }
  .pill.sample { color: var(--warn); background: var(--warn-bg); }
  .pill.running { color: var(--busy); background: var(--busy-bg); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  /* The one thing on the page that is happening as you watch it, so the dot
     moves: a long job otherwise looks identical to a stuck one. */
  .pill.running .dot { animation: beat 1.3s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .meta { color: var(--ink-soft); font-size: 13px; }
  .meta .line { display: block; }
  .meta .sub { color: var(--ink-faint); font-size: 12px; }
  .tag {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line);
    color: var(--ink-soft); background: var(--panel); margin-left: 4px;
  }
  .tag.app { color: #3538cd; border-color: #ccceff; background: #eef0ff; }

  .actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  button {
    font: inherit; font-size: 13px;
    padding: 5px 11px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #cfd4dc; }
  button:disabled { color: var(--ink-faint); cursor: default; }
  button.primary { border-color: #f0b4ae; background: var(--bad-bg); color: var(--bad); font-weight: 600; }
  button.primary:hover:not(:disabled) { border-color: #e39a92; }
  .actions .link { text-align: center; }

  .banner {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 10px 14px; margin-bottom: 18px; border-radius: 8px;
    background: var(--bad-bg); color: var(--bad); font-size: 13px;
  }
  .banner .link { color: var(--bad); }

  .retime { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--ink-soft); }
  .retime select, .retime input {
    font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .retime input.count { width: 68px; text-align: right; }
  .retime select:disabled { color: var(--ink-faint); }
  .retime .reads { color: var(--ink-faint); font-size: 12.5px; }
  .retime .reads.bad { color: var(--bad); }
  .link {
    border: 0; background: none; padding: 2px 0; color: var(--ink-faint);
    font-size: 12px; text-decoration: underline; text-underline-offset: 2px; cursor: pointer;
  }
  .link:hover { color: var(--ink); }

  .detail { grid-column: 1 / -1; padding: 4px 0 2px; }
  table.hist { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.hist th { text-align: left; font-weight: 600; color: var(--ink-faint); padding: 4px 10px 4px 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  table.hist td { padding: 4px 10px 4px 0; color: var(--ink-soft); border-top: 1px solid var(--line); vertical-align: top; }
  table.hist td.res.ok { color: var(--ok); font-weight: 600; }
  table.hist td.res.bad { color: var(--bad); font-weight: 600; }
  /* Stopped early is not a failure of the job, so it is not red. */
  table.hist td.res.cut { color: var(--warn); font-weight: 600; }
  pre.raw {
    margin: 8px 0 0; padding: 12px 14px; max-height: 340px; overflow: auto;
    background: #16181d; color: #e6e8eb; border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .rawlinks { display: flex; gap: 14px; margin-top: 8px; }
  .empty { color: var(--ink-faint); padding: 28px 4px; }
  .note { color: var(--ink-faint); font-size: 12.5px; margin: 14px 0 0; }
</style>
</head>
<body>
<div class="wrap">

  <header class="page">
    <div>
      <h1>Routines</h1>
      <p>Everything in your workspace that runs on its own.</p>
    </div>
    <button id="reload">Refresh</button>
  </header>

  <div class="summary" id="summary"></div>

  <div id="body"><p class="empty">Loading.</p></div>

  <p class="note">Read live from your schedule settings each time this page loads, so anything new or changed shows up here on its own.</p>

</div>

<script>
const TRIGGER_TAGS = {scheduled: "Automatic", manual: "Manual"};
const state = {open: new Map(), units: [], limits: {}, anyRunning: false};

// How often the page re-reads everything. Faster while something is actually
// running, because that is when the page is being watched rather than glanced
// at -- and a run that has just finished should show its result promptly.
const IDLE_REFRESH_MS = 30000;
const RUNNING_REFRESH_MS = 5000;

let refreshTimer = null;

// Re-armed after every render rather than a fixed interval, so the rate can
// follow what is happening. Never redraws while a schedule editor is open --
// that would throw away a half-made choice.
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => {
    if ([...state.open.values()].includes("retime")) scheduleRefresh();
    else load();
  }, state.anyRunning ? RUNNING_REFRESH_MS : IDLE_REFRESH_MS);
}

function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value !== null && value !== undefined) node.setAttribute(key, value);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return node;
}

async function load() {
  const response = await fetch("/api/routines");
  if (!response.ok) {
    document.getElementById("body").replaceChildren(
      el("p", {class: "empty"}, "Could not read your schedule settings just now."));
    scheduleRefresh();
    return;
  }
  render(await response.json());
}

function render(data) {
  state.units = data.cadence_units || [];
  state.limits = data.cadence_limits || {};
  state.anyRunning = data.routines.some((row) => row.is_running);
  const summary = document.getElementById("summary");
  summary.replaceChildren(...[
    stat(data.summary.total, "Routines"),
    stat(data.summary.healthy, "Healthy"),
    stat(data.summary.needs_attention, "Needs attention", data.summary.needs_attention > 0),
    data.summary.sample_only ? stat(data.summary.sample_only, "Sample data only") : null,
    stat(data.summary.next_run, "Next run"),
  ].filter(Boolean));

  const body = document.getElementById("body");
  body.replaceChildren();
  for (const group of data.groups) {
    const rows = data.routines.filter((row) => row.group === group.key);
    if (!rows.length) continue;
    body.append(el("h2", {class: "section"}, group.label,
      el("span", {class: "blurb"}, group.blurb)));
    for (const row of rows) body.append(routineRow(row));
  }
  if (!data.routines.length) {
    body.append(el("p", {class: "empty"}, "Nothing runs on its own yet."));
  }
  scheduleRefresh();
}

function stat(value, label, isBad) {
  return el("div", {},
    el("span", {class: "n" + (isBad ? " bad" : "")}, value),
    el("span", {class: "k"}, label));
}

function routineRow(row) {
  const container = el("div", {class: "row"});
  const detail = el("div", {class: "detail"});
  detail.hidden = !state.open.has(row.id);

  const name = el("div", {class: "name"},
    row.title,
    row.app_label ? el("span", {class: "tag app"}, row.app_label) : null,
    !row.is_described ? el("span", {class: "tag"}, "Not described yet") : null,
    el("span", {class: "what" + (row.is_described ? "" : " raw")}, row.what),
    el("button", {class: "link", onclick: () => toggle(row, detail)},
       state.open.get(row.id) === "history" ? "Hide details" : "Run history and logs"));

  const when = el("div", {class: "meta"},
    el("span", {class: "line"}, row.schedule),
    row.schedule_detail ? el("span", {class: "line sub"}, row.schedule_detail) : null);

  const lastLine = row.kind === "service"
    ? el("span", {class: "line sub"}, row.last_run_label)
    : el("span", {class: "line sub"},
        "Last run " + row.last_run_label,
        TRIGGER_TAGS[row.last_trigger]
          ? el("span", {class: "tag"}, TRIGGER_TAGS[row.last_trigger])
          : null);

  // A run in flight takes over the health cell: "is it going right now" is the
  // question being asked of a row whose button was just pressed, and the
  // last-run line cannot answer it (a record only exists once a run finishes).
  const health = row.is_running
    ? el("div", {class: "meta"},
        el("span", {class: "line"},
          el("span", {class: "pill running"}, el("span", {class: "dot"}), "Running")),
        el("span", {class: "line sub"}, row.running_label))
    : el("div", {class: "meta"},
        el("span", {class: "line"},
          el("span", {class: "pill " + row.health}, el("span", {class: "dot"}), row.health_label)),
        row.health_detail ? el("span", {class: "line sub"}, row.health_detail) : lastLine);

  const actions = el("div", {class: "actions"});
  if (row.needs_fixing) {
    const fix = el("button", {class: "primary", onclick: () => fixIt(row, fix)}, "Fix it");
    actions.append(fix);
  }
  if (row.is_running) {
    // Survives the auto-refresh, unlike a label set on the button itself: the
    // page rebuilds this row every few seconds and reads the state from the
    // server each time.
    const busy = el("button", {title: row.running_label}, "Running");
    busy.disabled = true;
    actions.append(busy);
  } else if (row.can_run_now) {
    const button = el("button", {onclick: () => runNow(row, button)}, "Run now");
    actions.append(button);
  }
  if (row.can_pause) {
    const label = row.is_paused ? "Turn on" : "Turn off";
    const toggle = el("button", {onclick: () => setPaused(row, !row.is_paused, toggle)}, label);
    actions.append(toggle);
  }
  if (row.can_retime) {
    actions.append(el("button", {class: "link", onclick: () => toggleRetime(row, detail)}, "Change schedule"));
  }
  if (!row.can_run_now && !row.can_pause && row.app) {
    actions.append(el("button", {onclick: () => openApp(row.app)}, "Open"));
  }

  container.append(name, when, health, actions, detail);
  if (state.open.get(row.id) === "retime") retimeEditor(row, detail);
  else if (state.open.has(row.id)) fillDetail(row, detail);
  return container;
}

function toggle(row, detail) {
  if (state.open.get(row.id) === "history") state.open.delete(row.id);
  else state.open.set(row.id, "history");
  load();
}

async function fillDetail(row, detail) {
  detail.replaceChildren(el("p", {class: "empty"}, "Loading."));
  const response = await fetch(`/api/routines/${encodeURIComponent(row.id)}/runs`);
  const runs = response.ok ? (await response.json()).runs : [];

  const table = el("table", {class: "hist"},
    el("thead", {}, el("tr", {},
      el("th", {}, "When"), el("th", {}, "Trigger"), el("th", {}, "Result"),
      el("th", {}, "Took"), el("th", {}, ""))),
    el("tbody", {}, runs.map((run) => {
      const outputCell = el("td", {});
      if (run.output) {
        outputCell.append(el("button", {class: "link", onclick: (event) => {
          const existing = event.target.parentElement.querySelector("pre");
          if (existing) { existing.remove(); event.target.textContent = "Output"; return; }
          event.target.textContent = "Hide output";
          event.target.parentElement.append(el("pre", {class: "raw"}, run.output));
        }}, "Output"));
      }
      return el("tr", {},
        el("td", {title: run.started_at}, run.when_exact),
        el("td", {}, run.trigger_label),
        el("td", {class: "res " + (run.was_interrupted ? "cut" : run.did_succeed ? "ok" : "bad")},
           run.result_label),
        el("td", {}, run.duration),
        outputCell);
    })));

  detail.replaceChildren();
  if (runs.length) {
    detail.append(table);
  } else {
    detail.append(el("p", {class: "note"},
      "No runs recorded yet. Every run from now on is logged here with what started it."));
  }

  const links = el("div", {class: "rawlinks"});
  links.append(el("button", {class: "link", onclick: () => showRaw(detail, `/api/routines/${encodeURIComponent(row.id)}/log`)}, "Full log"));
  if (row.kind === "scheduled") {
    links.append(el("button", {class: "link", onclick: () => showRaw(detail, `/api/routines/${encodeURIComponent(row.id)}/definition`)}, "Schedule entry"));
  }
  detail.append(links);
}

async function showRaw(detail, url) {
  const existing = detail.querySelector("pre.rawview");
  if (existing) existing.remove();
  const response = await fetch(url);
  const text = await response.text();
  const block = el("pre", {class: "raw rawview"}, text);
  detail.append(block);
  block.scrollTop = block.scrollHeight;
}

async function runNow(row, button) {
  button.disabled = true;
  button.textContent = "Running";
  const response = await fetch(`/api/routines/${encodeURIComponent(row.id)}/run`, {method: "POST"});
  if (!response.ok) {
    await showActionError(button, response, "Could not start it.");
    return;
  }
  // The run is detached and marks itself as started a moment later, so give it
  // that moment; from then on the row itself says it is running, for however
  // long the job takes.
  state.anyRunning = true;
  setTimeout(load, 1500);
}

async function setPaused(row, shouldPause, button) {
  button.disabled = true;
  button.textContent = shouldPause ? "Turning off" : "Turning on";
  const response = await fetch(`/api/routines/${encodeURIComponent(row.id)}/pause`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({paused: shouldPause}),
  });
  if (!response.ok) {
    await showActionError(button, response, "Could not change it.");
    return;
  }
  load();
}

async function fixIt(row, button) {
  button.disabled = true;
  button.textContent = "Opening a chat";
  const response = await fetch(`/api/routines/${encodeURIComponent(row.id)}/diagnose`, {method: "POST"});
  if (!response.ok) {
    await showActionError(button, response, "Could not start a chat.");
    return;
  }
  // The chat app surfaces the window itself; saying so stops a second click.
  button.textContent = "Chat opened";
}

async function showActionError(button, response, fallback) {
  const body = await response.json().catch(() => ({}));
  button.textContent = "Didn't work";
  button.title = body.error || fallback;
  banner(body.error || fallback);
}

function banner(text) {
  const existing = document.getElementById("banner");
  if (existing) existing.remove();
  const node = el("div", {class: "banner", id: "banner"}, text,
    el("button", {class: "link", onclick: () => node.remove()}, "Dismiss"));
  document.querySelector(".wrap").prepend(node);
}

// The schedule editor lives in the row's detail area so it opens in place,
// beside the cadence it is changing.
function toggleRetime(row, detail) {
  if (detail.dataset.mode === "retime" && !detail.hidden) {
    detail.hidden = true;
    detail.dataset.mode = "";
    state.open.delete(row.id);
    return;
  }
  state.open.set(row.id, "retime");
  load();
}

function hourLabel(h) {
  return `${h % 12 || 12}:00 ${h < 12 ? "am" : "pm"}`;
}

// "6h" -> {count: "6", unit: "h"}, so the editor opens on what is set now.
function splitCadence(every) {
  const match = /^(\d+)([mhd])$/.exec(every || "");
  return match ? {count: match[1], unit: match[2]} : {count: "1", unit: "h"};
}

function unitFor(token) {
  return state.units.find((option) => option.value === token) || state.units[0]
    || {value: "h", label: "hours", label_one: "hour", seconds: 3600};
}

function retimeEditor(row, detail) {
  const current = splitCadence(row.every);

  const count = el("input", {type: "number", min: "1", step: "1", class: "count", value: current.count});
  const unit = el("select", {});
  for (const option of state.units) {
    const node = el("option", {value: option.value}, option.label);
    if (option.value === current.unit) node.selected = true;
    unit.append(node);
  }

  const hour = el("select", {});
  hour.append(el("option", {value: ""}, "any time"));
  for (let h = 0; h < 24; h++) {
    const node = el("option", {value: String(h)}, hourLabel(h));
    if (row.at_hour === h) node.selected = true;
    hour.append(node);
  }

  const reads = el("span", {class: "reads"});
  const save = el("button", {onclick: async () => {
    save.disabled = true;
    save.textContent = "Saving";
    const response = await fetch(`/api/routines/${encodeURIComponent(row.id)}/cadence`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({count: count.value, unit: unit.value, at_hour: hour.value || null}),
    });
    if (!response.ok) {
      await showActionError(save, response, "Could not change the schedule.");
      return;
    }
    state.open.delete(row.id);
    load();
  }}, "Save");

  // Whatever the typed number cannot be, said in the user's words. The server
  // checks the same things, so this only saves them a round trip.
  const problemWith = () => {
    const number = Number(count.value);
    if (!String(count.value).trim() || !Number.isInteger(number)) return "Type a whole number.";
    if (number < 1) return "It has to be at least 1.";
    const seconds = number * unitFor(unit.value).seconds;
    if (state.limits.max_seconds && seconds > state.limits.max_seconds) {
      return "That is longer than a year apart.";
    }
    return "";
  };

  // A time of day only means anything once the gap is a day or more: below that
  // run_job.sh would hold the job for that hour and skip the rest of the day.
  const sync = () => {
    const trouble = problemWith();
    const chosen = unitFor(unit.value);
    const number = Number(count.value);
    const seconds = trouble ? 0 : number * chosen.seconds;
    const canPickHour = seconds >= (state.limits.hour_from_seconds || 86400);
    hour.disabled = !canPickHour;
    if (!canPickHour) hour.value = "";
    save.disabled = Boolean(trouble);
    reads.className = "reads" + (trouble ? " bad" : "");
    if (trouble) {
      reads.textContent = trouble;
      return;
    }
    const word = number === 1 ? chosen.label_one : `${number} ${chosen.label}`;
    reads.textContent = `Runs every ${word}${hour.value === "" ? "" : ` at ${hourLabel(Number(hour.value))}`}.`;
  };
  count.addEventListener("input", sync);
  unit.addEventListener("change", sync);
  hour.addEventListener("change", sync);
  count.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !save.disabled) save.click();
  });
  sync();

  detail.replaceChildren(el("div", {class: "retime"},
    el("span", {}, "Run every"), count, unit,
    el("span", {}, "at"), hour,
    save,
    el("button", {class: "link", onclick: () => { state.open.delete(row.id); load(); }}, "Cancel"),
    reads));
}

function openApp(name) {
  const host = location.host.split(".").slice(1).join(".");
  window.open(`${location.protocol}//${name}.${host}/`, "_blank");
}

document.getElementById("reload").addEventListener("click", load);
load();
if (window.parent !== window) window.parent.postMessage({type: "shell:location", path: location.pathname + location.search}, "*");
</script>
</body>
</html>
