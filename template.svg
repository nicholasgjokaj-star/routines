<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Routines: a list of scheduled jobs with their cadence, health and last run">
  <rect width="240" height="160" rx="12" fill="#eef2f6"/>
  <rect x="8" y="8" width="224" height="144" rx="9" fill="#fbfbfc" stroke="#e4e7ec"/>

  <!-- title bar -->
  <rect x="16" y="15" width="14" height="14" rx="4.5" fill="#8EAFCB"/>
  <path d="M19.5 18.2h7M20.3 18.2c0 2.6 1.4 3.6 2.7 3.8-1.3.2-2.7 1.2-2.7 3.8h5.4c0-2.6-1.4-3.6-2.7-3.8 1.3-.2 2.7-1.2 2.7-3.8M19.5 25.8h7" fill="none" stroke="#492222" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="35" y="25.6" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#16181d">Routines</text>
  <rect x="160" y="16" width="64" height="12" rx="6" fill="#fdeceb"/>
  <circle cx="168" cy="22" r="2.2" fill="#b42318"/>
  <text x="173" y="24.8" font-family="Helvetica, Arial, sans-serif" font-size="6.6" font-weight="600" fill="#b42318">1 needs fixing</text>

  <!-- column labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="5.6" fill="#8b929e" letter-spacing=".3">
    <text x="27" y="40">ROUTINE</text>
    <text x="128" y="40">SCHEDULE</text>
    <text x="183" y="40">LAST RUN</text>
  </g>

  <!-- row: failing -->
  <rect x="15" y="44" width="210" height="24" rx="5" fill="#fff" stroke="#f3c7c3"/>
  <circle cx="22" cy="56" r="3" fill="#b42318"/>
  <text x="29" y="54.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" font-weight="600" fill="#16181d">News digest</text>
  <rect x="29" y="57.8" width="58" height="3.2" rx="1.6" fill="#e4e7ec"/>
  <rect x="91" y="51" width="22" height="10" rx="5" fill="#b42318"/>
  <text x="102" y="58.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="5.8" font-weight="700" fill="#fff">Fix it</text>
  <rect x="126" y="50.5" width="50" height="11" rx="5.5" fill="#f1f2f4"/>
  <text x="151" y="57.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#5d6470">Every 6 hours</text>
  <rect x="182" y="50.5" width="36" height="11" rx="5.5" fill="#eef0ff"/>
  <text x="200" y="57.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" font-weight="600" fill="#3538cd">auto</text>

  <!-- row: working -->
  <rect x="15" y="72" width="210" height="24" rx="5" fill="#fff" stroke="#e4e7ec"/>
  <circle cx="22" cy="84" r="3" fill="#12805c"/>
  <text x="29" y="82.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" font-weight="600" fill="#16181d">Weekly check-up</text>
  <rect x="29" y="85.8" width="70" height="3.2" rx="1.6" fill="#e4e7ec"/>
  <rect x="126" y="78.5" width="50" height="11" rx="5.5" fill="#f1f2f4"/>
  <text x="151" y="85.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#5d6470">Mondays, 9 am</text>
  <rect x="182" y="78.5" width="36" height="11" rx="5.5" fill="#eef0ff"/>
  <text x="200" y="85.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" font-weight="600" fill="#3538cd">auto</text>

  <!-- row: paused -->
  <rect x="15" y="100" width="210" height="24" rx="5" fill="#fff" stroke="#e4e7ec"/>
  <circle cx="22" cy="112" r="3" fill="#d08a12"/>
  <text x="29" y="110.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" font-weight="600" fill="#16181d">Photo sync</text>
  <rect x="29" y="113.8" width="50" height="3.2" rx="1.6" fill="#e4e7ec"/>
  <rect x="126" y="106.5" width="50" height="11" rx="5.5" fill="#fdf3e3"/>
  <text x="151" y="113.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" font-weight="600" fill="#96620a">Paused</text>
  <rect x="182" y="106.5" width="36" height="11" rx="5.5" fill="#f1f2f4"/>
  <text x="200" y="113.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" font-weight="600" fill="#5d6470">manual</text>

  <!-- row: working service -->
  <rect x="15" y="128" width="210" height="18" rx="5" fill="#fff" stroke="#e4e7ec"/>
  <circle cx="22" cy="137" r="3" fill="#12805c"/>
  <text x="29" y="139.6" font-family="Helvetica, Arial, sans-serif" font-size="7.4" font-weight="600" fill="#16181d">Backup</text>
  <rect x="126" y="131.5" width="50" height="11" rx="5.5" fill="#f1f2f4"/>
  <text x="151" y="138.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#5d6470">Continuous</text>
  <rect x="182" y="131.5" width="36" height="11" rx="5.5" fill="#eef0ff"/>
  <text x="200" y="138.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" font-weight="600" fill="#3538cd">auto</text>
</svg>
